<!Doctype html>
<html>
    <head>
        <style>
            .card{
                border-width: 2px;
                border-style: solid;
                padding :7px;
                width:300px;
                border-color: gray;
                border-radius:5px;
                
            }
            .box{
                font-size: 20px;
                display:flex;
                flex-direction: row;
                width:300px;
                justify-content: space-between;
                margin-bottom: 5px;
               
            }
            .notifications{
                background-color: blue;
                color:white;
                border:none;
                height:25px;
                width:40px;
                text-align: center;
                border-radius:50px;
                padding-top: 5px;

            }
        </style>
        <body>
            <div class="card">
               <div class="box">
                <div>Home</div>
                <div class="notifications">14</div>
               </div> 
               <div class="box">
                <div>Notifications</div>
                <div class ="notifications">3</div>
               </div>
               <div class="box">
                <div>Messages</div>
                <div class ="notifications">5</div>
               </div>
            </div>
        </body>
    
</html>
